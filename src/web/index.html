<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Camera Grid</title>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e8ee; --muted:#8b93a7; --accent:#5b8cff; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:10; }
    header h1 { font-size:18px; margin:0; }
    .controls { display:flex; gap:12px; align-items:center; color:var(--muted); }
    .controls select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
    main#grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:10px; padding:16px; }
    main#grid[data-cols="1"] { grid-template-columns:1fr; }
    main#grid[data-cols="2"] { grid-template-columns:repeat(2,1fr); }
    main#grid[data-cols="3"] { grid-template-columns:repeat(3,1fr); }
    main#grid[data-cols="4"] { grid-template-columns:repeat(4,1fr); }
    .cell { position:relative; background:#000; border:1px solid var(--line); border-radius:10px; overflow:hidden; aspect-ratio:16/9; }
    .cell video { width:100%; height:100%; object-fit:contain; display:block; }
    .cell .label { position:absolute; left:8px; bottom:8px; padding:2px 8px; border-radius:6px; background:rgba(0,0,0,.55); color:#fff; font-size:13px; pointer-events:none; }
    .cell .full { position:absolute; top:8px; right:8px; opacity:0; transition:opacity .15s; background:rgba(0,0,0,.55); color:#fff; border:1px solid rgba(255,255,255,.2); border-radius:6px; padding:4px 8px; cursor:pointer; font-size:13px; }
    .cell:hover .full { opacity:1; }
    .cell .full:hover { background:var(--accent); }
    .cell:fullscreen { aspect-ratio:auto; border:none; border-radius:0; }
    .cell .ptz { position:absolute; right:10px; bottom:34px; display:grid; grid-template-columns:repeat(3,34px); grid-template-rows:repeat(3,34px); gap:3px; opacity:0; transition:opacity .15s; }
    .cell:hover .ptz { opacity:1; }
    .cell .ptz button { background:rgba(0,0,0,.6); color:#fff; border:1px solid rgba(255,255,255,.25); border-radius:6px; font-size:16px; cursor:pointer; }
    .cell .ptz button:hover { background:var(--accent); }
    .cell .ptz button:disabled { opacity:.5; cursor:wait; }
    .cell .ptz .ptz-up { grid-area:1/2; } .cell .ptz .ptz-left { grid-area:2/1; } .cell .ptz .ptz-right { grid-area:2/3; } .cell .ptz .ptz-down { grid-area:3/2; }
    #status { padding:0 16px 16px; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <header>
    <h1>Camera Grid</h1>
    <div class="controls">
      <label>colunas
        <select id="cols">
          <option value="auto">auto</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </label>
    </div>
  </header>
  <main id="grid" aria-busy="true"></main>
  <div id="status">carregando…</div>
  <script src="app.js"></script>
</body>
</html>
